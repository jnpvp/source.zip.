
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Educativo de Mira</title>
<style>
body {
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.painel {
  background: #1d2b36;
  padding: 25px;
  border-radius: 15px;
  max-width: 400px;
  margin: auto;
}
h1 { color: #00ff99; }
button {
  background: #00cc88;
  color: black;
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  margin: 8px;
  font-size: 16px;
}
.mira {
  width: 180px;
  height: 180px;
  border: 2px solid #00ff99;
  border-radius: 50%;
  margin: 25px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  color: #00ff99;
}
</style>
</head>
<body>
<div class="painel">
<h1>PAINEL EDUCATIVO</h1>
<p>Treinamento visual e educativo</p>
<div class="mira">＋</div>
<button onclick="alert('Treinamento iniciado!')">INICIAR</button>
<button onclick="alert('Configurações do painel')">CONFIGURAÇÕES</button>
<p>Projeto educativo</p>
</div>
</body>
  </html>
